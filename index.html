    background-size:cover;
    background-position:center center;
    background-attachment:fixed;
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:224px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--pine) 0%,var(--pine-deep) 100%);
    color:#eef1ec;
    padding:26px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    padding:0 22px 20px 22px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:14px;
  }
  .brand-mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.08em;
    color:#f0a95c;
    font-weight:600;
  }
  .brand-title{
    font-size:18px;
    font-weight:700;
    margin-top:5px;
    line-height:1.3;
    letter-spacing:-0.01em;
  }
  /* Kurum logosu: logo.png varsa metinlerin yerine görünür */
  .brand-logo{display:none;width:100%;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.45));}
  .brand-logo.ok{display:block;}
  .brand-logo.ok + .brand-text{display:none;}
  .login-logo{display:none;width:100%;height:auto;margin-bottom:6px;}
  .login-logo.ok{display:block;}
  .login-logo.ok ~ .login-fallback{display:none;}
  .nav{display:flex;flex-direction:column;padding:0 12px;gap:2px;}
  .nav button{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    font-size:13.5px;
    font-weight:500;
    color:#c3d2cb;
    transition:background .14s ease, color .14s ease;
  }
  .nav button .nav-ic{font-size:14px;width:16px;text-align:center;opacity:0.85;}
  .nav button:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav button.active{background:rgba(255,255,255,0.13);color:#fff;box-shadow:inset 3px 0 0 #f0a95c;}
  .sidebar-foot{
    margin-top:auto;
    padding:16px 22px 0 22px;
    font-size:11.5px;
    color:#8aa199;
    border-top:1px solid rgba(255,255,255,0.12);
    line-height:1.7;
  }
  .cloud-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fbf8f;margin-right:6px;box-shadow:0 0 0 3px rgba(95,191,143,0.18);}
  .cloud-dot.pending{background:#e0a95f;box-shadow:0 0 0 3px rgba(224,169,95,0.18);}

  /* Main */
  .main{flex:1;padding:36px 42px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
  .page-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .page-head p{margin:5px 0 0 0;color:var(--ink-soft);font-size:13.5px;max-width:640px;line-height:1.5;}

  .grid-2{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;} .main{padding:24px 18px;} .sidebar{width:100%;}}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow-sm);
  }
  .card h2{font-size:14.5px;margin:0 0 16px 0;font-weight:600;color:var(--ink);}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;margin-top:14px;font-weight:500;}
  label:first-of-type{margin-top:0;}
  input,select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    font-size:13.5px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus,select:focus{outline:none;border-color:var(--pine-light);box-shadow:0 0 0 3px rgba(44,83,127,0.16);background:#fff;}

  .btn{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 17px;
    border-radius:var(--radius-sm);
    font-size:13.5px;
    font-weight:600;
    text-align:center;
    transition:background .12s ease, transform .05s ease, opacity .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:linear-gradient(180deg,var(--pine-light),var(--pine));color:#fff;box-shadow:0 2px 8px rgba(15,30,51,0.30);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:#eff4ef;color:var(--ink);}
  .btn-row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;
    font-weight:700;
    color:var(--ink-soft);
    font-size:10.5px;
    letter-spacing:0.07em;
    text-transform:uppercase;
    padding:9px 10px;
    border-bottom:1px solid var(--line);
  }
  td{padding:10px 10px;border-bottom:1px solid #edf1ed;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .1s ease;}
  tbody tr:hover{background:#f3f7f3;}
  .num{font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:right;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .icon-btn{
    all:unset;cursor:pointer;font-size:12px;color:var(--ink-soft);padding:4px 9px;border-radius:6px;transition:background .1s ease,color .1s ease;
  }
  .icon-btn:hover{background:#eef1ec;color:var(--ink);}
  .icon-btn.danger:hover{background:var(--brick-soft);color:var(--brick);}

  .badge{
    display:inline-block;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;
    letter-spacing:0.02em;
    border:1px solid rgba(0,0,0,0.05);
    font-family:'IBM Plex Mono',monospace;
  }
  .badge-ok{background:var(--ok-soft);color:var(--ok);}
  .badge-deficit{background:var(--brick-soft);color:var(--brick);}
  .badge-surplus{background:var(--stamp-soft);color:var(--stamp);}

  .empty{color:var(--ink-soft);font-size:13px;padding:26px 6px;text-align:center;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .toolbar select{width:auto;min-width:180px;}

  .summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  @media (max-width:760px){.summary-row{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px 17px 21px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pine);}
  .stat.accent::before{background:var(--stamp);}
  .stat.deficit::before{background:var(--brick);}
  .stat .label{font-size:10.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:7px;}
  .stat.accent .value{color:var(--stamp);}
  .stat.deficit .value{color:var(--brick);}

  .section-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin:28px 0 10px 0;letter-spacing:0.06em;text-transform:uppercase;}
  .section-title:first-child{margin-top:0;}
  .section-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:28px 0 10px 0;}
  .section-title-row .section-title{margin:0;}
  .toggle-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);font-weight:500;margin:0;cursor:pointer;}
  .toggle-check input[type="checkbox"]{width:auto;margin:0;cursor:pointer;}

  /* Rapor: üstte belirgin dönem filtre çubuğu */
  .report-filter-bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--pine) 0%,var(--pine-deep) 100%);
    color:#eef1ec;
    padding:14px 18px;
    border-radius:var(--radius);
    border:1px solid rgba(255,255,255,0.14);
    margin-bottom:22px;
    box-shadow:var(--shadow-md);
  }
  .report-filter-bar .field{display:flex;align-items:center;gap:8px;}
  .report-filter-bar label{margin:0;font-size:12px;font-weight:600;color:#c9d3cd;white-space:nowrap;}
  .report-filter-bar select{width:auto;background:#fff;color:var(--ink);}
  .report-filter-bar select.month-select{
    min-width:190px;
    font-size:14.5px;
    font-weight:700;
    border:2px solid var(--stamp);
    color:var(--pine);
    padding:9px 10px;
  }
  .report-filter-bar .btn-ghost-inv{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.28);margin-left:auto;}
  .report-filter-bar .btn-ghost-inv:hover{background:rgba(255,255,255,0.18);}
  @media (max-width:760px){.report-filter-bar .btn-ghost-inv{margin-left:0;}}
  .save-indicator{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#a9d9c1;font-family:'IBM Plex Mono',monospace;min-width:0;}

  /* Belirgin satır/sütun çizgili tablo */
  table.table-grid{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
  table.table-grid th, table.table-grid td{border:1px solid var(--line);}
  table.table-grid thead th{background:#e7ebe4;}
  table.table-grid tbody tr:nth-child(even){background:#f5f7f3;}
  table.table-grid tbody tr:hover{background:var(--stamp-soft);}
  /* Özet toplam satırı: ekranda ve yazdırmada zıt renk */
  table.table-grid tfoot tr.total-row{background:var(--pine);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  table.table-grid tfoot tr.total-row td{color:#fff;border-color:var(--pine);font-weight:700;}
  table.table-grid tfoot tr.total-row .num{color:#fff;}

  .hint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.55;}

  .print-only{display:none;}
  @media print{
    .no-print{display:none !important;}
    .print-only{display:block !important;}
    body{background:#fff;}
    #app{display:block;}
    .main{padding:0;max-width:100%;width:100%;}
    body{background:#fff !important;color:#16241f !important;}
    .card,.stat{background:#fff !important;}
    .stat .value{color:#16241f !important;}
    .stat.accent .value{color:#c1622b !important;}
    .stat.deficit .value{color:#a23b3b !important;}
    input,select{background:#fff !important;color:#16241f !important;}
    .card{border:1px solid #999;padding:8px;break-inside:avoid;max-width:100%;overflow:hidden;}
    .summary-row{grid-template-columns:repeat(4,1fr);gap:8px;}
    .stat{padding:8px 9px;min-width:0;overflow:hidden;}
    .stat .label{font-size:9px;}
    .stat .value{font-size:11px;overflow-wrap:anywhere;word-break:break-word;}
    table{width:100%;max-width:100%;font-size:8.5px;table-layout:auto;}
    th,td{padding:3px 4px;vertical-align:middle;overflow-wrap:break-word;}
    /* Firma/Ay sütunu kaysın, rakam sütunları tek satırda sığsın */
    table.table-grid td:first-child, table.table-grid th:first-child{white-space:normal;overflow-wrap:break-word;max-width:34mm;}
    table.table-grid td:nth-child(n+2), table.table-grid th:nth-child(n+2){white-space:nowrap;}
    .num{white-space:nowrap;font-size:8.5px;letter-spacing:-0.01em;}
    .badge{font-size:8px;padding:2px 6px;white-space:nowrap;}
    .mono{font-size:8.5px;}
    .section-title{margin:14px 0 8px 0;}
    tr{break-inside:avoid;}
    table.table-grid tfoot tr.total-row{background:#1d3a5f !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    table.table-grid tfoot tr.total-row td{color:#fff !important;border-color:#1d3a5f !important;}
    table.table-grid tfoot tr.total-row .num{color:#fff !important;}
    /* Mobil görünümde de baskı her zaman masaüstü (web) düzeninde çıksın */
    body.mobile-view .main{padding:0;}
    body.mobile-view .page-head h1{font-size:22px;}
    body.mobile-view .summary-row{grid-template-columns:repeat(4,1fr);gap:8px;}
    body.mobile-view .stat .value{font-size:11px;}
    body.mobile-view .card{padding:8px;overflow:visible;}
    body.mobile-view table{font-size:8.5px;min-width:0;}
    body.mobile-view th,body.mobile-view td{padding:3px 4px;white-space:normal;}
    body.mobile-view table.table-grid td:first-child,body.mobile-view table.table-grid th:first-child{max-width:34mm;min-width:0;}
    body.mobile-view table.table-grid td:nth-child(n+2),body.mobile-view table.table-grid th:nth-child(n+2){white-space:nowrap;}
    body.mobile-view .num{font-size:8.5px;}
    body.mobile-view .badge{font-size:8px;}
    body.mobile-view .mono{font-size:8.5px;}
    body.mobile-view .toolbar{flex-direction:row;align-items:center;}
    @page{size:A4 portrait;margin:10mm 8mm;}
  }

  /* Toast: otomatik kayıt bildirimi */
  #toast{
    position:fixed;bottom:22px;right:22px;z-index:50;
    background:var(--pine);color:#eef1ec;
    padding:10px 16px;border-radius:var(--radius-sm);
    font-size:12.5px;font-weight:500;
    box-shadow:var(--shadow-md);
    display:flex;align-items:center;gap:8px;
    opacity:0;transform:translateY(6px);
    transition:opacity .18s ease, transform .18s ease;
    pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateY(0);}
  #toast .dot{width:6px;height:6px;border-radius:50%;background:#5fbf8f;flex-shrink:0;}

  /* Alt imza barı */
  body{padding-bottom:40px;}
  .credit-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--pine);color:#eef1ec;
    text-align:center;font-size:12px;font-weight:600;letter-spacing:0.02em;
    padding:10px 12px;
    border-top:1px solid rgba(255,255,255,0.12);
  }

  /* Görünüm değiştirme butonu (sayfa en üstü, sabit) */
  #view-toggle{
    position:fixed;top:12px;right:14px;z-index:70;
    width:40px;height:40px;border-radius:50%;
    background:var(--pine);color:#fff;border:1px solid rgba(255,255,255,0.25);
    font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-md);
  }
  #view-toggle:hover{background:var(--pine-light);}
  #theme-toggle{
    position:fixed;top:12px;right:62px;z-index:70;
    width:40px;height:40px;border-radius:50%;
    background:var(--pine);color:#fff;border:1px solid rgba(255,255,255,0.25);
    font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-md);
  }
  #theme-toggle:hover{background:var(--pine-light);}

  body.dark-mode input,body.dark-mode select{background:#172033;border-color:#2a3850;color:var(--ink);}
  body.dark-mode input:focus,body.dark-mode select:focus{background:#1b2940;border-color:var(--pine-light);}
  body.dark-mode td{border-bottom-color:#202c40;}
  body.dark-mode tbody tr:hover{background:#18243a;}
  body.dark-mode table.table-grid thead th{background:#1a2639;}
  body.dark-mode table.table-grid tbody tr:nth-child(even){background:#141e2f;}
  body.dark-mode table.table-grid tbody tr:hover{background:#1b2940;}
  body.dark-mode .icon-btn:hover{background:#1a2639;color:#fff;}
  body.dark-mode .btn-ghost:hover{background:#1a2639;color:#fff;}
  body.dark-mode .hint{color:#94a3b8;}
  body.dark-mode .report-filter-bar select{background:#172033;color:#e7edf5;border-color:#2a3850;}
  body.dark-mode .report-filter-bar select.month-select{color:#f0b26b;border-color:var(--stamp);}
  body.dark-mode option{background:#172033;color:#e7edf5;}
  body.dark-mode #login-screen{background:#0b1220 !important;}
  body.dark-mode #login-screen>div{background:#111827 !important;border-color:#263247 !important;}
  body.dark-mode #login-screen>div>div:nth-child(3){color:#e7edf5 !important;}
  body.dark-mode #login-screen label{color:#94a3b8 !important;}
  body.dark-mode #login-screen input{background:#172033 !important;border-color:#2a3850 !important;color:#e7edf5 !important;}
  body.dark-mode #login-screen p{color:#94a3b8 !important;}

  /* Mobil görünüm modu (butonla açılır, dar ekranda otomatik) */
  body.mobile-view #app{flex-direction:column;}
  body.mobile-view .sidebar{width:100%;padding:14px 0 10px 0;}
  body.mobile-view .brand{padding:0 16px 12px 16px;}
  body.mobile-view .brand-title{font-size:16px;}
  body.mobile-view .nav{flex-direction:row;overflow-x:auto;padding:0 10px 4px 10px;}
  body.mobile-view .nav button{white-space:nowrap;flex-shrink:0;}
  body.mobile-view .sidebar-foot{font-size:11px;padding:10px 16px 0 16px;}
  body.mobile-view .main{padding:66px 14px 20px 14px;max-width:100%;}
  body.mobile-view .page-head h1{font-size:19px;}
  body.mobile-view .grid-2{grid-template-columns:1fr;}
  body.mobile-view .summary-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  body.mobile-view .stat{padding:13px 14px;}
  body.mobile-view .stat .value{font-size:16px;overflow-wrap:anywhere;}
  body.mobile-view .card{padding:16px;max-width:100%;overflow-x:auto;}
  body.mobile-view table{font-size:12px;min-width:560px;}
  body.mobile-view th,body.mobile-view td{padding:8px 7px;white-space:nowrap;}
  body.mobile-view table.table-grid td:first-child,body.mobile-view table.table-grid th:first-child{white-space:normal;min-width:110px;}
  body.mobile-view .toolbar{flex-direction:column;align-items:flex-start;}
  body.mobile-view .toolbar select{min-width:0;width:100%;}
  body.mobile-view .report-filter-bar{flex-direction:column;align-items:stretch;}
  body.mobile-view .report-filter-bar select{width:100%;}
  body.mobile-view .report-filter-bar select.month-select{min-width:0;}
  body.mobile-view .report-filter-bar .btn-ghost-inv{margin-left:0;}
  body.mobile-view .credit-bar{font-size:11px;padding:8px 10px;}
  @media (max-width:760px){
    .card{overflow-x:auto;}
    table{min-width:520px;}
  }

  /* Onay / şifre / uyarı penceresi (uygulama içi, tarayıcı kutusu yerine) */
  .modal-overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(15,30,51,0.45);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    animation:modalFade .15s ease;
  }
  @keyframes modalFade{from{opacity:0;}to{opacity:1;}}
  .modal-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 18px 50px rgba(15,30,51,0.25);
    max-width:400px;width:100%;
    padding:24px 22px 20px 22px;
    animation:modalPop .16s ease;
  }
  @keyframes modalPop{from{opacity:0;transform:translateY(8px) scale(0.98);}to{opacity:1;transform:none;}}
  .modal-card h3{margin:0 0 8px 0;font-size:16px;font-weight:700;letter-spacing:-0.01em;}
  .modal-card p{margin:0 0 6px 0;font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .modal-card input{
    width:100%;margin-top:10px;padding:10px 11px;
    border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:13.5px;font-family:inherit;background:#fbfbfa;color:var(--ink);
  }
  .modal-card input:focus{outline:none;border-color:var(--pine-light);box-shadow:0 0 0 3px rgba(44,83,127,0.16);background:#fff;}
  .modal-err{color:var(--brick);font-size:12.5px;min-height:18px;margin-top:8px;}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
</style>
</head>
<body>

<!-- ================= GİRİŞ EKRANI ================= -->
<div id="login-screen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#eef1ec;font-family:'Inter',system-ui,sans-serif;padding:20px;">
  <div style="background:#fff;border:1px solid #dde3da;border-radius:14px;padding:34px 32px;max-width:360px;width:100%;box-shadow:0 10px 34px rgba(15,30,51,0.09);">
    <img class="login-logo" src="logo.png" alt="Foça Kantin Başkanlığı MF Takip" onload="this.classList.add('ok')" onerror="this.classList.remove('ok')">
    
    <div class="login-fallback" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.05em;color:#c1622b;font-weight:600;">FOÇA KANTİN BAŞKANLIĞI</div>
    <div style="font-size:19px;font-weight:700;margin:4px 0 22px 0;color:#16241f;letter-spacing:-0.01em;">MF Takip'e giriş yap</div>
    <form id="login-form">

let cloudReady = false;
let unsubscribeSnapshot = null;

async function attachCloudSync(){
  try{
    const snap = await DOC_REF.get();
    if(snap.exists){
      data = Object.assign({companies:[],invoices:[],bonuses:[]}, snap.data());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      await DOC_REF.set(data);
    }
  }catch(e){ console.error('İlk bulut yükleme hatası', e); }
  cloudReady = true;
  render();
  if(!unsubscribeSnapshot){
    unsubscribeSnapshot = DOC_REF.onSnapshot(snap=>{
      if(!snap.exists) return;
      const remote = snap.data();
      if(JSON.stringify(remote) !== JSON.stringify(data)){
        data = Object.assign({companies:[],invoices:[],bonuses:[]}, remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        render();
      }
    }, err=>console.error('Bulut senkronizasyon hatası', err));
  }
}

function detachCloudSync(){
  cloudReady = false;
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
}

<script>
let data = { companies: [], invoices: [], bonuses: [] };
let ui = {
  tab: 'rapor',

  editInvoiceId: null,
  editBonusId: null,
  invoiceMonthFilter: 'all',
  invoiceCompanyFilter: 'all',

  reportExclVat: false,
  reportVatRate: 20,
  showInvoiceDetail: false,
  invoiceDraft: {companyId:'', invoiceNo:'', date:'', amount:''},
  bonusDraft: {companyId:'', period:'', date:'', barcode:'', name:'', qty:'', unitPrice:''}
};

const STORAGE_KEY = 'isletme-mal-fazlasi-v1';
const AY_ADLARI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data = Object.assign({companies:[],invoices:[],bonuses:[]}, parsed);
    }
  }catch(e){ /* henüz kayıt yok, varsayılan boş veriyle devam */ }
  render();
}

// Her ekleme / düzenleme / silme işleminden hemen sonra çağrılır.
// Kullanıcının "kaydet" butonuna basmasına gerek yok: veriler önce tarayıcıya,
// ardından buluttaki veritabanına (Firestore) otomatik yazılır.
async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){ console.error('Kayıt hatası (tarayıcı)', e); }
  if(cloudReady){
    try{
      await DOC_REF.set(data);
      showToast('Kaydedildi');
    }catch(e){
      console.error('Bulut kayıt hatası', e);
      showToast('Bulut kaydı başarısız, tekrar denenecek');
    }
  }
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  const textEl = document.getElementById('toast-text');
  if(!el || !textEl) return;
  textEl.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

// Uygulama içi pencere: çirkin tarayıcı confirm/prompt/alert kutuları yerine.
// modalConfirm -> true/false, modalPrompt -> yazılan değer / null, modalAlert -> bilgi.
let modalResolve = null;
function closeModal(result){
  document.getElementById('modal-overlay').style.display = 'none';
  const r = modalResolve; modalResolve = null;
  if(r) r(result);
}
function openModal({title, msg, okText, cancelText, danger, showInput, inputType, check}){
  return new Promise(resolve=>{
    modalResolve = resolve;
    const overlay = document.getElementById('modal-overlay');
    const titleEl = document.getElementById('modal-title');
    const msgEl = document.getElementById('modal-msg');
    const inputEl = document.getElementById('modal-input');
    const errEl = document.getElementById('modal-err');
    const okBtn = document.getElementById('modal-ok');
    const cancelBtn = document.getElementById('modal-cancel');
    titleEl.textContent = title || '';
    msgEl.textContent = msg || '';
    errEl.textContent = '';
    okBtn.textContent = okText || 'Tamam';
    okBtn.className = 'btn ' + (danger ? 'btn-primary' : 'btn-primary');
    okBtn.style.background = danger ? 'var(--brick)' : '';
    cancelBtn.textContent = cancelText || 'Vazgeç';
    cancelBtn.style.display = cancelText === null ? 'none' : '';
    if(showInput){
      inputEl.style.display = 'block';
      inputEl.type = inputType || 'text';
      inputEl.value = '';
      inputEl.placeholder = '';
    } else {
      inputEl.style.display = 'none';
    }
    overlay.style.display = 'flex';
    overlay.onclick = e=>{ if(e.target===overlay) closeModal(showInput ? null : false); };
    okBtn.onclick = ()=>{
      if(showInput){
        const v = inputEl.value;
        if(check){
          const err = check(v);
          if(err){ errEl.textContent = err; inputEl.focus(); return; }
        }
        closeModal(v);
      } else {
        closeModal(true);
      }
    };
    cancelBtn.onclick = ()=> closeModal(showInput ? null : false);
    inputEl.onkeydown = e=>{ if(e.key==='Enter') okBtn.click(); };
    overlay.onkeydown = e=>{ if(e.key==='Escape') closeModal(showInput ? null : false); };
    setTimeout(()=>{ (showInput ? inputEl : okBtn).focus(); }, 30);
  });
}
function modalConfirm(title, msg, okText){
  return openModal({title, msg, okText: okText||'Sil', danger:true});
}
function modalPrompt(title, msg, inputType){
  return openModal({title, msg, okText:'Onayla', showInput:true, inputType:inputType||'text',
    check: v=> v ? '' : 'Bu alan boş bırakılamaz.'});
}
function modalAlert(title, msg){
  return openModal({title, msg, okText:'Tamam', cancelText:null});
}
document.addEventListener('keydown', e=>{
  const overlay = document.getElementById('modal-overlay');
  if(overlay && overlay.style.display==='flex' && e.key==='Escape'){
    const inputVisible = document.getElementById('modal-input').style.display!=='none';
    closeModal(inputVisible ? null : false);
  }
});

function exportJson(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mal-fazlasi-veri-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const ok = await modalConfirm('İçe aktar', 'Mevcut veriler, seçtiğiniz dosyadaki verilerle değiştirilecek. Devam edilsin mi?', 'İçe aktar');
      if(ok){
        data = Object.assign({companies:[],invoices:[],bonuses:[]}, parsed);
        saveData();
        render();
        showToast('İçe aktarıldı');
      }
    }catch(err){ modalAlert('Dosya okunamadı', 'Dosya okunamadı veya geçersiz format.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ---------- TARİHLİ BULUT YEDEKLERİ (yedekler koleksiyonu) ----------
function backupDocId(d){
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + '-' + p(d.getMinutes()) + '-' + p(d.getSeconds());
}
function backupStatusMsg(msg){
  const el = document.getElementById('backupStatus');
  if(el) el.textContent = msg;
}
async function cloudBackup(){
  if(!cloudReady){ backupStatusMsg('Önce veritabanı bağlantısının kurulmasını bekleyin.'); return; }
  const now = new Date();
  const id = backupDocId(now);
  backupStatusMsg('Yedekleniyor… (' + id + ')');
  try{
    const user = (typeof auth!=='undefined' && auth.currentUser) ? auth.currentUser.email : '';
    await db.collection('yedekler').doc(id).set({
      name: id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdAtStr: id,
      by: user || '',
      payload: JSON.parse(JSON.stringify(data)),
      counts: {companies: data.companies.length, invoices: data.invoices.length, bonuses: data.bonuses.length}
    });
    backupStatusMsg('Yedeklendi: ' + id);
    showToast('Buluta yedeklendi');
    loadBackupList();
  }catch(err){
    console.error('Bulut yedekleme hatası', err);
    const noPerm = err && err.code === 'permission-denied';
    backupStatusMsg(noPerm
      ? 'İzin hatası: Firestore Kuralları > yedekler koleksiyonuna giriş yapmış kullanıcılara yazma izni verin.'
      : 'Yedekleme başarısız: ' + (err.message||err));
  }
}
async function loadBackupList(){
  const box = document.getElementById('backupList');
  if(!box) return;
  if(!cloudReady){ box.innerHTML = '<p class="hint">Bağlantı kurulunca yedek listesi gelecek.</p>'; return; }
  box.innerHTML = '<p class="hint">Yedekler yükleniyor…</p>';
  try{
    const snap = await db.collection('yedekler').orderBy('name','desc').limit(20).get();
    if(snap.empty){ box.innerHTML = '<p class="hint">Henüz bulut yedeği yok.</p>'; return; }
    box.innerHTML = '<table><thead><tr><th>Tarih</th><th>İçerik</th><th></th></tr></thead><tbody>' + snap.docs.map(doc=>{
      const v = doc.data()||{};
      const c = v.counts||{};
      const label = v.createdAtStr || doc.id;
      const info = (c.companies||0) + ' firma · ' + (c.invoices||0) + ' fatura · ' + (c.bonuses||0) + ' MF';
      return '<tr><td class="mono">' + escapeHtml(label) + '</td><td>' + escapeHtml(info) + '</td>' +
        '<td><div class="row-actions"><button class="icon-btn" data-restore-backup="' + escapeHtml(doc.id) + '">Geri yükle</button>' +
        '<button class="icon-btn danger" data-del-backup="' + escapeHtml(doc.id) + '">Sil</button></div></td></tr>';
    }).join('') + '</tbody></table>';
    box.querySelectorAll('[data-restore-backup]').forEach(b=>b.addEventListener('click',()=>restoreBackup(b.dataset.restoreBackup)));
    box.querySelectorAll('[data-del-backup]').forEach(b=>b.addEventListener('click',()=>deleteBackup(b.dataset.delBackup)));
  }catch(err){
    console.error('Yedek listesi hatası', err);
    box.innerHTML = '<p class="hint">Liste alınamadı: ' + escapeHtml(err.message||err) + '</p>';
  }
}
async function restoreBackup(id){
  const ok = await modalConfirm('Yedeği geri yükle', id + ' tarihli yedek geri yüklenecek. Mevcut veriler bununla değiştirilecek. Devam edilsin mi?', 'Geri yükle');
  if(!ok) return;
  try{
    const doc = await db.collection('yedekler').doc(id).get();
    if(!doc.exists){ modalAlert('Bulunamadı', 'Yedek bulunamadı.'); return; }
    const payload = doc.data().payload || {};
    data = Object.assign({companies:[],invoices:[],bonuses:[]}, payload);
    await saveData();
    render();
    showToast('Yedekten geri yüklendi');
  }catch(err){ console.error('Geri yükleme hatası', err); modalAlert('Geri yükleme başarısız', err.message||String(err)); }
}
async function deleteBackup(id){
  const ok = await modalConfirm('Yedeği sil', id + ' tarihli yedek silinsin mi?', 'Sil');
  if(!ok) return;
  try{
    await db.collection('yedekler').doc(id).delete();
    showToast('Yedek silindi');
    loadBackupList();
  }catch(err){ console.error('Yedek silme hatası', err); modalAlert('Silme başarısız', err.message||String(err)); }
}

function money(n){
  return (Number(n)||0).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺';
}
function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return day+'.'+m+'.'+y;
}
function monthKey(d){ return d ? d.slice(0,7) : ''; }
function currentMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  if(key==='all') return 'Tüm zamanlar';
  const [y,m] = key.split('-');
  return AY_ADLARI[parseInt(m,10)-1] + ' ' + y;
}
function companyName(id){
  const c = data.companies.find(c=>c.id===id);
  return c ? c.name : '—';
}
function companyPercent(id){
  const c = data.companies.find(c=>c.id===id);
  return c ? c.percent : 0;
}
function availableMonths(list){
  const set = new Set(list.map(x=>monthKey(x.date)).filter(Boolean));
  return Array.from(set).sort().reverse();
}
function bonusPeriod(b){
  // Eski kayıtlarda "period" alanı olmayabilir; bu durumda teslim tarihinin ayına düş.
  return b.period || monthKey(b.date);
}
function availableBonusPeriods(){
  const set = new Set(data.bonuses.map(b=>bonusPeriod(b)).filter(Boolean));
  return Array.from(set).sort().reverse();
}
function companyFilterOptions(selected, allowAll=true){
  const opts = [...(allowAll?['all']:[]), ...data.companies.map(c=>c.id)];
  // allowAll=false iken selected 'all' kalırsa ilk firmaya düş
  let sel = selected;
  if(!allowAll && (sel==='all' || !opts.includes(sel))){
    sel = opts[0] || 'all';
  }
  return opts.map(id=>{
    const label = id==='all' ? 'Tüm firmalar' : companyName(id);
    return `<option value="${id}" ${sel===id?'selected':''}>${escapeHtml(label)}</option>`;
  }).join('');
}

// ---------- AYLIK RAPOR ----------
function renderRapor(){
  const months = Array.from(new Set([...availableMonths(data.invoices), ...availableBonusPeriods(), currentMonthKey()])).sort().reverse();
  // Tüm zamanlar seçiliyken firma seçimi zorunlu: 'all' + 'all' kombinasyonuna izin verme
  if(ui.reportMonth==='all' && ui.reportCompany==='all' && data.companies.length){
    ui.reportCompany = data.companies[0].id;
  }
  const monthOptions = ['all',...months].map(m=>`<option value="${m}" ${ui.reportMonth===m?'selected':''}>${monthLabel(m)}</option>`).join('');
  const reportAllowAllCompanies = ui.reportMonth!=='all';
  if(!reportAllowAllCompanies && ui.reportCompany==='all' && data.companies.length){
    ui.reportCompany = data.companies[0].id;
  }

  let invoices = data.invoices.slice();
  if(ui.reportMonth!=='all') invoices = invoices.filter(i=>monthKey(i.date)===ui.reportMonth);
  if(ui.reportCompany!=='all') invoices = invoices.filter(i=>i.companyId===ui.reportCompany);
  invoices.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  let bonusesInPeriod = data.bonuses.slice();
  if(ui.reportMonth!=='all') bonusesInPeriod = bonusesInPeriod.filter(b=>bonusPeriod(b)===ui.reportMonth);
  if(ui.reportCompany!=='all') bonusesInPeriod = bonusesInPeriod.filter(b=>b.companyId===ui.reportCompany);

  let totalAmount=0, totalExpected=0;
  // Fatura tutarı KDV dahil giriliyor. "KDV hariç hesapla" seçiliyse hem Tutar
  // sütunu/toplamlar hem beklenen MF, KDV düşülmüş matrah üzerinden gösterilir.
  const vatRateNum = parseFloat(ui.reportVatRate)||0;
  const vatDivisor = ui.reportExclVat ? (1 + vatRateNum/100) : 1;
  function netFor(inv){
    return inv.amount / vatDivisor;
  }
  function expectedFor(inv){
    return netFor(inv) * companyPercent(inv.companyId) / 100;
  }
  const tutarColLabel = ui.reportExclVat ? 'Tutar (KDV hariç)' : 'Tutar';
  const invRows = invoices.map(inv=>{
    const net = netFor(inv);
    const expected = expectedFor(inv);
    totalAmount += net; totalExpected += expected;
    return `<tr>
      <td>${fmtDate(inv.date)}</td>
      <td>${escapeHtml(companyName(inv.companyId))}</td>
      <td>${escapeHtml(inv.invoiceNo||'—')}</td>
      <td class="num">${money(net)}</td>
      <td class="num">%${companyPercent(inv.companyId)}</td>
      <td class="num">${money(expected)}</td>
    </tr>`;
  }).join('');

  const totalReceived = bonusesInPeriod.reduce((s,b)=>s + b.qty*b.unitPrice, 0);

  function badgeFor(expected, received){
    const fark = received - expected;
    if(expected===0 && received===0) return '<span class="badge" style="background:#eef1ec;color:var(--ink-soft);">—</span>';
    if(Math.abs(fark) < 0.01) return '<span class="badge badge-ok">Tam</span>';
    if(fark < 0) return '<span class="badge badge-deficit">Eksik</span>';
    return '<span class="badge badge-surplus">Fazla</span>';
  }

  // Özet tablosu iki modda çalışır:
  // - Tek firma seçiliyse (özellikle Tüm zamanlar): ay ay ayrı satırlar
  // - Tüm firmalar (tek ay): firma bazında satırlar, Firmalar sayfası sırasıyla, 0 dahil
  const isSingleCompany = ui.reportCompany!=='all';
  let summaryTitle, summaryHead, summaryRowsHtml, summaryFootHtml, summaryHint;
  if(isSingleCompany){
    const monthKeys = ui.reportMonth==='all' ? months : [ui.reportMonth];
    const byMonth = {};
    monthKeys.forEach(m=>{ byMonth[m] = {count:0, amount:0, expected:0, received:0}; });
    invoices.forEach(inv=>{
      const mk = monthKey(inv.date);
      if(!byMonth[mk]) byMonth[mk] = {count:0, amount:0, expected:0, received:0};
      const net = netFor(inv);
      const expected = expectedFor(inv);
      byMonth[mk].count++;
      byMonth[mk].amount += net;
      byMonth[mk].expected += expected;
    });
    bonusesInPeriod.forEach(b=>{
      const mk = bonusPeriod(b);
      if(!byMonth[mk]) byMonth[mk] = {count:0, amount:0, expected:0, received:0};
      byMonth[mk].received += b.qty*b.unitPrice;
    });
    summaryTitle = 'Ay bazında özet — ' + companyName(ui.reportCompany);
    summaryHead = '<tr><th>Ay</th><th style="text-align:right">Fatura</th><th style="text-align:right">' + tutarColLabel + '</th><th style="text-align:right">Beklenen</th><th style="text-align:right">Alınan</th><th style="text-align:right">Fark</th><th>Durum</th></tr>';
    summaryRowsHtml = monthKeys.map(mk=>{
      const v = byMonth[mk];
      const fark = v.received - v.expected;
      return `<tr>
        <td class="mono">${escapeHtml(monthLabel(mk))}</td>
        <td class="num">${v.count}</td>
        <td class="num">${money(v.amount)}</td>
        <td class="num">${money(v.expected)}</td>
        <td class="num">${money(v.received)}</td>
        <td class="num">${money(fark)}</td>
        <td>${badgeFor(v.expected, v.received)}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="7"><div class="empty">Bu dönemde veri yok.</div></td></tr>`;
    const totM = Object.values(byMonth).reduce((s,v)=>({count:s.count+v.count, amount:s.amount+v.amount, expected:s.expected+v.expected, received:s.received+v.received}), {count:0, amount:0, expected:0, received:0});
    const totMfark = totM.received - totM.expected;
    summaryFootHtml = `<tr class="total-row">
        <td>TOPLAM</td>
        <td class="num">${totM.count}</td>
        <td class="num">${money(totM.amount)}</td>
        <td class="num">${money(totM.expected)}</td>
        <td class="num">${money(totM.received)}</td>
        <td class="num">${money(totMfark)}</td>
        <td>${badgeFor(totM.expected, totM.received)}</td>
      </tr>`;
    summaryHint = 'Seçili firmanın ay ay kırılımıdır. Alınan tutar, o aya kayıtlı tüm MF Ürünler girişlerinin toplamıdır.';
  } else {
    // Firma bazlı özet — beklenen faturalardan, alınan ise firma+aya bağlı MF kayıtlarından hesaplanır
    // Seçili ayda hareketi olmasa da tüm firmalar 0 olarak listelenir
    const byCompany = {};
    const visibleCompanyIds = data.companies.map(c=>c.id);
    visibleCompanyIds.forEach(cid=>{ byCompany[cid] = {count:0, amount:0, expected:0, received:0}; });
    invoices.forEach(inv=>{
      const net = netFor(inv);
      const expected = expectedFor(inv);
      if(!byCompany[inv.companyId]) byCompany[inv.companyId] = {count:0, amount:0, expected:0, received:0};
      byCompany[inv.companyId].count++;
      byCompany[inv.companyId].amount += net;
      byCompany[inv.companyId].expected += expected;
    });
    bonusesInPeriod.forEach(b=>{
      if(!byCompany[b.companyId]) byCompany[b.companyId] = {count:0, amount:0, expected:0, received:0};
      byCompany[b.companyId].received += b.qty*b.unitPrice;
    });
    const companyOrder = new Map(data.companies.map((c,i)=>[c.id,i]));
    summaryTitle = 'Firma bazında özet';
    summaryHead = '<tr><th>Firma</th><th style="text-align:right">Fatura</th><th style="text-align:right">' + tutarColLabel + '</th><th style="text-align:right">Beklenen</th><th style="text-align:right">Alınan</th><th style="text-align:right">Fark</th><th>Durum</th></tr>';
    summaryRowsHtml = Object.keys(byCompany).length ? Object.entries(byCompany).sort((a,b)=>{
      const oa = companyOrder.has(a[0]) ? companyOrder.get(a[0]) : 9999;
      const ob = companyOrder.has(b[0]) ? companyOrder.get(b[0]) : 9999;
      if(oa!==ob) return oa-ob;
      return companyName(a[0]).localeCompare(companyName(b[0]),'tr');
    }).map(([cid,v])=>{
      const fark = v.received - v.expected;
      return `<tr>
        <td>${escapeHtml(companyName(cid))}</td>
        <td class="num">${v.count}</td>
        <td class="num">${money(v.amount)}</td>
        <td class="num">${money(v.expected)}</td>
        <td class="num">${money(v.received)}</td>
        <td class="num">${money(fark)}</td>
        <td>${badgeFor(v.expected, v.received)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="7"><div class="empty">Bu dönemde veri yok.</div></td></tr>`;
    const totC = Object.values(byCompany).reduce((s,v)=>({count:s.count+v.count, amount:s.amount+v.amount, expected:s.expected+v.expected, received:s.received+v.received}), {count:0, amount:0, expected:0, received:0});
    const totCfark = totC.received - totC.expected;
    summaryFootHtml = `<tr class="total-row">
        <td>TOPLAM</td>
        <td class="num">${totC.count}</td>
        <td class="num">${money(totC.amount)}</td>
        <td class="num">${money(totC.expected)}</td>
        <td class="num">${money(totC.received)}</td>
        <td class="num">${money(totCfark)}</td>
        <td>${badgeFor(totC.expected, totC.received)}</td>
      </tr>`;
    summaryHint = 'Alınan tutar, o firmaya ait ve seçilen aya kayıtlı tüm MF Ürünler girişlerinin toplamıdır — belirli bir faturaya değil, firma + aya bağlıdır.';
  }


  if(ui.reportExclVat) summaryHint += ' Tutar ve Beklenen sütunları, KDV %' + (parseFloat(ui.reportVatRate)||0) + ' düşülmüş matrah üzerinden gösterilmiştir.';


  const totalFark = totalReceived - totalExpected;

  const reportCompanyLabel = ui.reportCompany==='all' ? 'Tüm firmalar' : companyName(ui.reportCompany);
  const vatModeLabel = ui.reportExclVat ? ('KDV hariç (KDV %' + (parseFloat(ui.reportVatRate)||0) + ')') : 'KDV dahil';
  const printedAt = new Date();
  const printedAtStr = fmtDate(printedAt.toISOString().slice(0,10)) + ' ' + printedAt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});


  return `
    <div class="report-filter-bar no-print">
      <div class="field">
        <label>Dönem</label>
        <select class="month-select" data-filter="reportMonth">${monthOptions}</select>
      </div>
      <div class="field">
        <label>Firma${ui.reportMonth==='all'?' *':''}</label>
        <select data-filter="reportCompany" ${ui.reportMonth==='all'?'required':''}>${companyFilterOptions(ui.reportCompany, reportAllowAllCompanies)}</select>
      </div>
      <div class="field">
        <label class="toggle-check" style="margin:0;color:#c9d3cd;white-space:nowrap;">
          <input type="checkbox" data-filter="reportExclVat" ${ui.reportExclVat?'checked':''} style="accent-color:#c1622b;">
          KDV hariç hesapla
        </label>
        ${ui.reportExclVat?`<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#c9d3cd;white-space:nowrap;">KDV %<input data-filter="reportVatRate" type="number" step="0.01" min="0" max="100" value="${escapeHtml(ui.reportVatRate)}" style="width:64px;padding:7px 8px;"></span>`:''}
      </div>
      <button class="btn btn-ghost-inv" data-print-report>🖨️ Yazdır</button>
    </div>

    <div class="page-head">
      <div>
        <h1>Aylık Rapor</h1>
        <p>Seçtiğiniz dönemde fatura tutarına göre ne kadar mal fazlası bekleniyor, firma bazında ne kadarı fiilen alındı.</p>
      </div>
    </div>

    <div class="print-only">
      <div style="font-size:16px;font-weight:700;">Foça Kantin Başkanlığı</div>
      <div style="font-size:13px;color:#4a5a54;">MF Takip &ndash; Aylık Rapor</div>
      <div style="font-size:12px;margin-top:6px;">
        Dönem: ${escapeHtml(monthLabel(ui.reportMonth))} &nbsp;|&nbsp;
        Firma: ${escapeHtml(reportCompanyLabel)} &nbsp;|&nbsp;
        Hesap: ${escapeHtml(vatModeLabel)} &nbsp;|&nbsp;
        Çıktı tarihi: ${printedAtStr}
      </div>
      <div style="border-bottom:2px solid #1d3a5f;margin-top:10px"></div>
    </div>

    <div class="summary-row">
      <div class="stat"><div class="label">Toplam fatura tutarı${ui.reportExclVat?' (KDV hariç)':' (KDV dahil)'}</div><div class="value">${money(totalAmount)}</div></div>
      <div class="stat"><div class="label">Beklenen mal fazlası${ui.reportExclVat?' (KDV hariç)':''}</div><div class="value">${money(totalExpected)}</div></div>
      <div class="stat accent"><div class="label">Alınan mal fazlası</div><div class="value">${money(totalReceived)}</div></div>
      <div class="stat ${totalFark<0?'deficit':''}"><div class="label">Fark</div><div class="value">${money(totalFark)}</div></div>
    </div>

    <div class="section-title">${escapeHtml(summaryTitle)}</div>
    <div class="card">
      <table class="table-grid">
        <thead>${summaryHead}</thead>
        <tbody>${summaryRowsHtml}</tbody>
        <tfoot>${summaryFootHtml}</tfoot>
      </table>
      <p class="hint no-print">${escapeHtml(summaryHint)}</p>
    </div>

    <div class="section-title-row">
      <div class="section-title">Fatura bazında detay</div>
      <label class="toggle-check no-print">
        <input type="checkbox" data-toggle-invoice-detail ${ui.showInvoiceDetail?'checked':''}>
        Göster
      </label>
    </div>
    ${ui.showInvoiceDetail ? `
    <div class="card">
      <table>
        <thead><tr><th>Tarih</th><th>Firma</th><th>Fatura No</th><th style="text-align:right">${tutarColLabel}</th><th style="text-align:right">Oran</th><th style="text-align:right">Beklenen</th></tr></thead>
        <tbody>${invRows || '<tr><td colspan="6"><div class="empty">Bu dönemde fatura yok.</div></td></tr>'}</tbody>
      </table>
    </div>
    ` : ''}
  `;
}

// ---------- VERİ & YEDEKLEME ----------
function renderVeri(){
  return `
    <div class="page-head">
      <div>
        <h1>Veri & Yedekleme</h1>
        <p>Yaptığınız her ekleme, düzenleme ve silme işlemi anında bulut veritabanına kaydedilir; ayrıca kaybolmasın diye tarayıcınızda da tutulur. Ayrı bir "kaydet" işlemi yapmanıza gerek yok.</p>
      </div>
    </div>
    <div class="card" style="max-width:640px">
      <h2><span class="cloud-dot ${cloudReady?'':'pending'}"></span>Otomatik kayıt</h2>
      <p class="hint" style="margin-top:0;">${cloudReady
        ? 'Şu an buluttaki veritabanına bağlısınız. Hangi cihazdan giriş yaparsanız yapın, aynı hesapla her zaman güncel veriyi görürsünüz.'
        : 'Bulut veritabanına bağlanılıyor…'}</p>
    </div>
    <div class="card" style="max-width:640px;margin-top:16px">
      <h2>Yedek al / geri yükle</h2>
      <p class="hint" style="margin-top:0;">Bu, veritabanının yerini tutmaz — ekstra bir güvenlik kopyası almak veya verileri başka bir yerden içe aktarmak içindir.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" data-export-json>⬇️ Dışa aktar (.json indir)</button>
        <button class="btn btn-ghost" data-trigger-import>⬆️ İçe aktar (.json yükle)</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json" style="display:none">
      <p class="hint">İçe aktarma, mevcut tüm verilerin yerine seçtiğiniz dosyadaki verileri yazar.</p>
    </div>
    <div class="card" style="max-width:640px;margin-top:16px">
      <h2>Veritabanına yedekle (tarihli)</h2>
      <p class="hint" style="margin-top:0;">Bulut veritabanında tarih isimli bir yedek kopya oluşturur. Siteyi GitHub'a yükleseniz de yedekler hesapta durur, istediğiniz tarihe geri dönebilirsiniz.</p>
      <div class="btn-row">
        <button class="btn btn-primary" data-backup-cloud>☁️ Veritabanına yedekle</button>
      </div>
      <div id="backupStatus" class="hint"></div>
      <div id="backupList" style="margin-top:10px;"></div>
    </div>
  `;
}


function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ---------- EVENTS ----------
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      // Veri & Yedekleme bölümü yönetici şifresi ile korunur.
      if(btn.dataset.tab==='veri'){
        const pw = await modalPrompt('Yönetici şifresi', 'Veri & Yedekleme bölümüne girmek için yönetici şifresini girin:', 'password');
        if(pw===null) return;
        if(pw!==ADMIN_PASSWORD){
          await modalAlert('Hatalı şifre', 'Yönetici şifresi hatalı. Bu bölüme giriş yapılamadı.');
          return;
        }
      }
      ui.tab = btn.dataset.tab;
      render();
    });
  });

  const invoiceFilter = app.querySelector('[data-filter="invoiceMonth"]');
  if(invoiceFilter) invoiceFilter.addEventListener('change', e=>{ ui.invoiceMonthFilter = e.target.value; render(); });

  const bonusFilter = app.querySelector('[data-filter="bonusMonth"]');
  if(bonusFilter) bonusFilter.addEventListener('change', e=>{ ui.bonusMonthFilter = e.target.value; render(); });

  const invoiceCompanyFilter = app.querySelector('[data-filter="invoiceCompany"]');
  if(invoiceCompanyFilter) invoiceCompanyFilter.addEventListener('change', e=>{ ui.invoiceCompanyFilter = e.target.value; render(); });

  const bonusCompanyFilter = app.querySelector('[data-filter="bonusCompany"]');
  if(bonusCompanyFilter) bonusCompanyFilter.addEventListener('change', e=>{ ui.bonusCompanyFilter = e.target.value; render(); });

  const reportFilter = app.querySelector('[data-filter="reportMonth"]');
  if(reportFilter) reportFilter.addEventListener('change', e=>{
    ui.reportMonth = e.target.value;
    // Tüm zamanlar seçilince firma zorunlu: Tüm firmalar'da kalınırsa ilk firmaya geç
    if(ui.reportMonth==='all' && ui.reportCompany==='all' && data.companies.length){
      ui.reportCompany = data.companies[0].id;
    }
    render();
  });

  const reportCompanyFilter = app.querySelector('[data-filter="reportCompany"]');
  if(reportCompanyFilter) reportCompanyFilter.addEventListener('change', e=>{
    // Tüm zamanlar modunda 'Tüm firmalar' seçimine izin verme
    if(ui.reportMonth==='all' && e.target.value==='all'){
      if(data.companies.length) ui.reportCompany = data.companies[0].id;
      render();
      return;
    }
    ui.reportCompany = e.target.value; render();
  });

  const reportExclVatFilter = app.querySelector('[data-filter="reportExclVat"]');
  if(reportExclVatFilter) reportExclVatFilter.addEventListener('change', e=>{ ui.reportExclVat = e.target.checked; render(); });

  const reportVatRateFilter = app.querySelector('[data-filter="reportVatRate"]');
  if(reportVatRateFilter){
    reportVatRateFilter.addEventListener('change', e=>{ ui.reportVatRate = e.target.value; render(); });
    reportVatRateFilter.addEventListener('input', e=>{ ui.reportVatRate = e.target.value; });
  }

  const printBtn = app.querySelector('[data-print-report]');
  if(printBtn) printBtn.addEventListener('click', ()=> window.print());

  const logoutBtn = app.querySelector('#logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ sessionStorage.removeItem('kantinfoca_logged_in'); showLoginScreen(); });

  const invoiceDetailToggle = app.querySelector('[data-toggle-invoice-detail]');
  if(invoiceDetailToggle) invoiceDetailToggle.addEventListener('change', e=>{ ui.showInvoiceDetail = e.target.checked; render(); });

  const exportBtn = app.querySelector('[data-export-json]');
  if(exportBtn) exportBtn.addEventListener('click', exportJson);
  const importTriggerBtn = app.querySelector('[data-trigger-import]');
  if(importTriggerBtn) importTriggerBtn.addEventListener('click', triggerImport);
  const importInput = app.querySelector('#importFileInput');
  if(importInput) importInput.addEventListener('change', handleImportFile);

  const backupBtn = app.querySelector('[data-backup-cloud]');
  if(backupBtn) backupBtn.addEventListener('click', cloudBackup);
  if(ui.tab==='veri') loadBackupList();

  // Company form
  const companyForm = app.querySelector('[data-form="company"]');
  if(companyForm) companyForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(companyForm);
    const id = fd.get('id');
    const name = fd.get('name').trim();
    const percent = parseFloat(fd.get('percent'));
    if(id){
      const c = data.companies.find(c=>c.id===id);
      c.name = name; c.percent = percent;
    } else {
      data.companies.push({id:uid(), name, percent});
    }
    ui.editCompanyId = null;
    saveData(); render();
  });
  app.querySelectorAll('[data-edit-company]').forEach(b=>b.addEventListener('click',()=>{ ui.editCompanyId = b.dataset.editCompany; render(); }));
  app.querySelectorAll('[data-del-company]').forEach(b=>b.addEventListener('click', async ()=>{
    const ok = await modalConfirm('Firmayı sil', 'Bu firmayı silmek istediğinize emin misiniz? Bağlı faturalar etkilenmez ama firma adı görünmez olur.', 'Sil');
    if(!ok) return;
    const pw = await modalPrompt('Yönetici şifresi', 'Silmek için yönetici şifresini girin:', 'password');
    if(pw===null) return;
    if(pw!==ADMIN_PASSWORD){ modalAlert('Hatalı şifre', 'Yönetici şifresi hatalı. Firma silinmedi.'); return; }
    data.companies = data.companies.filter(c=>c.id!==b.dataset.delCompany);
    saveData(); render();
  }));
  const cancelCompany = app.querySelector('[data-cancel-company]');
  if(cancelCompany) cancelCompany.addEventListener('click', ()=>{ ui.editCompanyId=null; render(); });

  // Invoice form
  const invoiceForm = app.querySelector('[data-form="invoice"]');
  if(invoiceForm){
    const isEditingInvoice = !!(invoiceForm.querySelector('input[name="id"]')||{}).value;
    // Yeni kayıtta yazdıklar render'da kaybolmasın diye taslağı güncel tut
    invoiceForm.querySelectorAll('input[name="invoiceNo"],input[name="date"],input[name="amount"]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        if(isEditingInvoice) return;
        ui.invoiceDraft[inp.name] = inp.value;
      });
    });
    const invCompanySel = invoiceForm.querySelector('select[name="companyId"]');
    if(invCompanySel) invCompanySel.addEventListener('change', e=>{
      if(isEditingInvoice) return;
      ui.invoiceDraft.companyId = e.target.value;
      // Formda firma seçilince liste de hemen o firmaya filtrelensin
      ui.invoiceCompanyFilter = e.target.value || 'all';
      render();
    });
    invoiceForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(invoiceForm);
    const id = fd.get('id');
    const payload = {
      companyId: fd.get('companyId'),
      invoiceNo: fd.get('invoiceNo').trim(),
      date: fd.get('date'),
      amount: parseFloat(fd.get('amount'))
    };
    if(id){
      Object.assign(data.invoices.find(i=>i.id===id), payload);
    } else {
      data.invoices.push({id:uid(), ...payload});
      ui.invoiceDraft = {companyId:payload.companyId||'', invoiceNo:'', date:payload.date||'', amount:''};
      ui.invoiceCompanyFilter = payload.companyId || 'all';
    }
    ui.editInvoiceId = null;
    saveData(); render();
    });
  }
  app.querySelectorAll('[data-edit-invoice]').forEach(b=>b.addEventListener('click',()=>{ ui.editInvoiceId = b.dataset.editInvoice; render(); }));
  app.querySelectorAll('[data-del-invoice]').forEach(b=>b.addEventListener('click', async ()=>{
    const ok = await modalConfirm('Faturayı sil', 'Bu faturayı silmek istediğinize emin misiniz?', 'Sil');
    if(!ok) return;
    const id = b.dataset.delInvoice;
    data.invoices = data.invoices.filter(i=>i.id!==id);
    data.bonuses = data.bonuses.filter(bn=>bn.invoiceId!==id);
    saveData(); render();
  }));
  const cancelInvoice = app.querySelector('[data-cancel-invoice]');
  if(cancelInvoice) cancelInvoice.addEventListener('click', ()=>{ ui.editInvoiceId=null; render(); });
  const clearInvoice = app.querySelector('[data-clear-invoice]');
  if(clearInvoice) clearInvoice.addEventListener('click', ()=>{
    ui.invoiceDraft = {companyId:'', invoiceNo:'', date:'', amount:''};
    ui.invoiceCompanyFilter = 'all';
    render();
  });

  // Bonus form
  const bonusForm = app.querySelector('[data-form="bonus"]');
  if(bonusForm){
    const isEditingBonus = !!(bonusForm.querySelector('input[name="id"]')||{}).value;
    bonusForm.querySelectorAll('input[name="period"],input[name="date"],input[name="barcode"],input[name="name"],input[name="qty"],input[name="unitPrice"]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        if(isEditingBonus) return;
        ui.bonusDraft[inp.name] = inp.value;
      });
    });
    const bnCompanySel = bonusForm.querySelector('select[name="companyId"]');
    if(bnCompanySel) bnCompanySel.addEventListener('change', e=>{
      if(isEditingBonus) return;
      ui.bonusDraft.companyId = e.target.value;
      ui.bonusCompanyFilter = e.target.value || 'all';
      render();
    });
    bonusForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(bonusForm);
    const id = fd.get('id');
    const payload = {
      companyId: fd.get('companyId'),
      period: fd.get('period'),
      date: fd.get('date'),
      barcode: fd.get('barcode').trim(),
      name: fd.get('name').trim(),
      qty: parseFloat(fd.get('qty')),
      unitPrice: parseFloat(fd.get('unitPrice'))
    };
    if(id){
      Object.assign(data.bonuses.find(b=>b.id===id), payload);
    } else {
      data.bonuses.push({id:uid(), ...payload});
      ui.bonusDraft = {companyId:payload.companyId||'', period:payload.period||'', date:payload.date||'', barcode:'', name:'', qty:'', unitPrice:''};
      ui.bonusCompanyFilter = payload.companyId || 'all';
    }
    ui.editBonusId = null;
    saveData(); render();
    });
  }
  app.querySelectorAll('[data-edit-bonus]').forEach(b=>b.addEventListener('click',()=>{ ui.editBonusId = b.dataset.editBonus; render(); }));
  app.querySelectorAll('[data-del-bonus]').forEach(b=>b.addEventListener('click', async ()=>{
    const ok = await modalConfirm('Kaydı sil', 'Bu mal fazlası kaydını silmek istediğinize emin misiniz?', 'Sil');
    if(!ok) return;
    data.bonuses = data.bonuses.filter(bn=>bn.id!==b.dataset.delBonus);
    saveData(); render();
  }));
  const cancelBonus = app.querySelector('[data-cancel-bonus]');
  if(cancelBonus) cancelBonus.addEventListener('click', ()=>{ ui.editBonusId=null; render(); });
  const clearBonus = app.querySelector('[data-clear-bonus]');
  if(clearBonus) clearBonus.addEventListener('click', ()=>{
    ui.bonusDraft = {companyId:'', period:'', date:'', barcode:'', name:'', qty:'', unitPrice:''};
    ui.bonusCompanyFilter = 'all';
    render();
  });
}

loadData();
</script>
</body>
</html>
